# 顺丰会员中心 · 每日签到（Cookie 版）
# 脚本：sfsy_sign.js
#
# 鉴权模型（2026-10-29 实测确认）：
#   身份 = Cookie 的 sessionId（= JSESSIONID），不是分享 URL、不是签名 token
#   signature = MD5("token=wwesldfs29aniversaryvdld29&timestamp=<13位ms>&sysCode=MCS-MIMP-CORE")
#   签到 body = {"comeFrom":"vioin","channelFrom":"SFAPP"}
#   返回 obj.hasFinishSign: 0 = 本次签到成功（奖励见 integralTaskSignPackageVOList），1 = 今日已签到
#   errorCode 100111 = 会话失效
#
# 会话会轮换：重新进入小程序后旧 sessionId 立即失效，脚本采集到新的会自动覆盖。
# 建议每天早上打开一次小程序（脚本顺手抓最新的），或直接手动跑一次任务。

hostname = mcs-mimp-web.sf-express.com

# ---- 1. 采集 sessionId（打开小程序任意会员页即触发，不弹多余通知）----
^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/(commonPost\/|ifLogin) url script-request-header https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_sign.js

# ---- 2. 定时签到（加到 QX 的 [task_local]）----
# 10 9 * * * https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_sign.js, tag=顺丰签到, enabled=true

# 说明：以上为 QX 重写片段格式，Surge 的 [Script] 语法与之不同，二者不可混用。
# Surge 等价写法（另存 .sgmodule）：
# [Script]
# 顺丰签到采集 = type=http-request,pattern=^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/(commonPost\/|ifLogin),script-path=https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_sign.js,requires-body=0
# 顺丰签到 = type=cron,cronexp=10 9 * * *,script-path=https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_sign.js,wake-system=1,timeout=20
# [MITM]
# hostname = %APPEND% mcs-mimp-web.sf-express.com
