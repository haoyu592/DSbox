# 顺丰会员中心 · 每日任务（Cookie 版）
# 脚本：sfsy_sign.js
#
# 鉴权模型（2026-10-30 真机实测确认）：
#   身份 = Cookie 的 sessionId（= JSESSIONID）
#   signature = MD5("token=wwesldfs29aniversaryvdld29&timestamp=<13位ms>&sysCode=MCS-MIMP-CORE")
#   注意：queryUserInfo 的 body 必须带 token="zeTLTYeG0bLetfRk"（固定常量），
#         漏了会报「权限验证失败,token错误」；该常量不能换成 sessionId。
#
# 任务流水线（每步独立容错、逐条汇报）：
#   1 积分(前) ~memberIntegral~userInfoService~queryUserInfo        body 需 token 常量
#   2 签到     ~memberNonactivity~integralSignV2Service~sign        body {}，已签到→3400002
#              （V2 异常时自动回落 ~integralTaskSignPlusService~automaticSignFetchPackage）
#   3 积分任务 ~memberNonactivity~integralTaskStrategyService~queryPointTaskAndSignFromES
#              body {deviceId, channelType:"3"}
#   4 超值福利 ~memberActLengthy~redPacketActivityService~superWelfare~receiveRedPacket
#              body 参数未确认（空 body 返回 999999），默认关闭
#   5 会员日   ~memberNonactivity~memberDayIndexService~index        仅 26-28 号
#   6 优惠券   /mcs-mimp/coupon/available/list                       body {pageNum,pageSize}
#   7 积分(后) 同 1，用于算积分增量
#
# 会话会轮换：重新进入小程序后旧 sessionId 立即失效，采到新的会自动覆盖。

hostname = mcs-mimp-web.sf-express.com

# ---- 1. 采集 sessionId（打开小程序任意会员页即触发，值不变则不通知）----
^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/(commonPost\/|ifLogin) url script-request-header https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_sign.js

# ---- 2. 定时任务（加到 QX 的 [task_local]）----
# 10 9 * * * https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_sign.js, tag=顺丰每日任务, enabled=true

# 说明：以上为 QX 重写片段格式，Surge 的 [Script] 语法与之不同，二者不可混用。
# Surge 等价写法（另存 .sgmodule）：
# [Script]
# 顺丰采集 = type=http-request,pattern=^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/(commonPost\/|ifLogin),script-path=https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_sign.js,requires-body=0
# 顺丰每日任务 = type=cron,cronexp=10 9 * * *,script-path=https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_sign.js,wake-system=1,timeout=30
# [MITM]
# hostname = %APPEND% mcs-mimp-web.sf-express.com
