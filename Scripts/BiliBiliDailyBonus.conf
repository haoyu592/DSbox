# 哔哩哔哩每日任务 · Cookie 采集（Quantumult X 重写片段）
# 脚本：BiliBiliDailyBonus.js  v1.6-mk
#
# 采集点三条，按需启用：
#   1. app.bilibili.com/x/resource/fingerprint      App 冷启动/切前台必调，频率最高  —— 默认启用
#   2. cm.bilibili.com/cm/api/conversion/*          广告转化埋点，App 切后台上报      —— 默认启用
#   3. app.bilibili.com/x/resource/fingerprint 的 response 阶段 —— 触发扫码登录     —— 默认关闭
#
# 重要：第 1 条与第 3 条互斥。同时启用时，同一请求会先抓包写盘、再弹二维码，两路互相覆盖。
#       需要扫码登录时，注释掉第 1 条并启用第 3 条；扫码成功拿到长期 cookie 后立刻改回来。
#
# 脚本 v1.6 起，access_key 支持从 URL / body 中提取，取不到时沿用已存的值，不会覆盖成 undefined；
# 同时缺少 access_key 时投币与分享自动回落 web 接口，任务不会中断。
# 注意 QX 的 script-request-header 阶段读不到 $request.body，故 cm 端点在 QX 下只补 cookie，
# 不提供 access_key，属预期行为。

hostname = app.bilibili.com, cm.bilibili.com

# ---- 1. APP 抓包（默认启用）----
^https:\/\/app\.bilibili\.com\/x\/resource\/fingerprint url script-request-header https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/BiliBiliDailyBonus.js

# ---- 2. cm 埋点补充采集（默认启用）----
^https?:\/\/cm\.bilibili\.com\/cm\/api\/conversion url script-request-header https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/BiliBiliDailyBonus.js

# ---- 3. 扫码登录（默认关闭；启用前先注释掉第 1 条）----
# ^https:\/\/app\.bilibili\.com\/x\/resource\/fingerprint url script-response-body https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/BiliBiliDailyBonus.js

# 定时任务不在此片段配置，需添加到 QX 的 [task_local]：
# 30 7 * * * https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/BiliBiliDailyBonus.js, tag=B站每日等级任务, enabled=true

# ---- Surge 等价写法（另存为 .sgmodule，与 QX 语法不可混用）----
# [Script]
# B站Cookie(APP) = type=http-request,pattern=^https?:\/\/(app|cm)\.bilibili\.com\/(x\/resource\/fingerprint|cm\/api\/conversion),script-path=https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/BiliBiliDailyBonus.js,requires-body=0
# B站每日任务 = type=cron,cronexp=30 7 * * *,script-path=https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/BiliBiliDailyBonus.js,wake-system=1,timeout=15
# [MITM]
# hostname = %APPEND% app.bilibili.com, cm.bilibili.com
#
# Surge 若需读取 cm 请求 body 中的 access_key，把上面 requires-body=0 改为 requires-body=1。
