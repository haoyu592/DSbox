# 重写规则配置片段包含若干条重写规则，并可以包含若干作用于 MitM 的主机名；可通过资源引用的方式使用。
# 片段文件将保存在 Quantumult X 目录下的 Profiles 子目录中。
# 样例可参见 https://raw.githubusercontent.com/crossutility/Quantumult-X/master/sample-import-rewrite.snippet
 
hostname = api.m.jd.com

# 京东获取Cookie
# 匹配范围放宽：原 functionId=weGameHome 接口已失效，改为 api.m.jd.com 全域，
# 脚本内部自带 pt_key 判定 + 30 分钟通知节流，不会刷屏。
^https:\/\/api\.m\.jd\.com\/ url script-request-header https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/JD_GetCookie_App.js

# ============================================================================
# Shadowrocket / Surge / Loon 用户请勿使用本 .conf 片段（语法不通用），
# 改用同目录下的模块文件：
#   Scripts/JD_Cookie.sgmodule
# 在 Shadowrocket「配置 → 模块 → 右上角 + → 填模块链接」导入即可。
# ============================================================================
