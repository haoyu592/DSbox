# 顺丰会员中心 · 登录态探针（Quantumult X 重写片段）
# 脚本：sfsy_probe.js —— 只读请求头，$done({}) 原样放行，不改请求不改响应
#
# 目的：确认 mcs-mimp-web 的 commonPost 业务接口到底用哪个 header / cookie 承载登录态。
# 背景（外部重放实测）：
#   签到接口 automaticSignFetchPackage → {"errorCode":"100111","errorMessage":"用户信息失效"}
#   ifLogin                          → {"obj":{"loginStatus":-1}}
#   带/不带 Cookie、加 token 头、错误签名结果都一样 → 无法从外部判定，需在设备侧取真实请求头。
#
# 用法：
#   1. 本片段加入 QX 的 [rewrite_local]，并确保 MITM 已开启且信任证书
#   2. 小程序打开「我的 → 积分 / 优惠券」页（触发 commonPost 与 ifLogin）
#   3. 收到「顺丰探针」通知即抓到；完整 headers 存在 sfsy_probe_raw
#   4. 排查完请删除本片段，探针会常驻弹通知
#
# 通知去重：同一接口 + 同一身份组合只弹一次；换账号或换 token 才会再弹。

hostname = mcs-mimp-web.sf-express.com

# ---- 1. 业务接口（签到 / 任务 / 积分 / 优惠券 / 会员日）----
^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/commonPost\/ url script-request-header https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_probe.js

# ---- 2. 登录态探测（loginStatus:-1 = 未登录）----
^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/ifLogin url script-request-header https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_probe.js

# ---- 3. 只要签到接口、噪音最小时：注释掉上面两条，启用这条 ----
# ^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/commonPost\/~memberNonactivity~integralTaskSignPlusService~automaticSignFetchPackage url script-request-header https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_probe.js

# 说明：以上为 QX 重写片段格式，Surge 的 [Script] 语法与之不同，二者不可混用。
# Surge 等价写法（另存 .sgmodule）：
# [Script]
# 顺丰探针 = type=http-request,pattern=^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/(commonPost\/|ifLogin),script-path=https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_probe.js,requires-body=0
# [MITM]
# hostname = %APPEND% mcs-mimp-web.sf-express.com

# ---- 4. 导出已抓内容（手动跑一次即可，不参与日常调度）----
# 加到 QX 的 [task_local]，然后在「任务」里点「运行」；脚本检测不到 $request 就会把
# sfsy_probe_raw 里的第一条记录按 800 字分段弹通知，方便复制回贴。
# 时间设为 1 月 1 日，避免它自动跑：
# 0 0 1 1 * https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_probe.js, tag=顺丰探针导出, enabled=true
