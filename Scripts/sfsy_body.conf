# 顺丰 · 请求体探针（Quantumult X 重写片段）
# 脚本：sfsy_body.js —— 只读，$done({}) 原样放行
#
# 用途：抓 commonPost 各接口 + coupon 接口的真实请求体。
#       QX 的 script-request-header 阶段拿不到 body，必须用 script-request-body。
#
# 用法：
#   1. 本片段加入 QX 的 [rewrite_local]，MITM 已开
#   2. 打开小程序「我的 → 积分 / 优惠券」页，翻一下任务列表
#   3. 收到「顺丰 body · POST」通知即捕获成功（同接口同 body 只弹一次）
#   4. 在 [task_local] 加下面那行，手动运行一次 → 分段导出全部已捕获 body

hostname = mcs-mimp-web.sf-express.com

^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/(commonPost\/|coupon\/) url script-request-body https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_body.js

# ---- 导出已捕获内容（手动跑一次，不参与日常调度）----
# 0 0 1 1 * https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_body.js, tag=顺丰body导出, enabled=true

# Surge 等价写法（另存 .sgmodule）：
# [Script]
# 顺丰body = type=http-request,pattern=^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/(commonPost\/|coupon\/),script-path=https://raw.githubusercontent.com/haoyu592/DSbox/main/Scripts/sfsy_body.js,requires-body=1
